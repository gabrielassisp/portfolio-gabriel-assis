# Airflow local (modo standalone: webserver + scheduler num container, banco Postgres).
# Uso: cp .env.example .env && docker compose up -d  ->  http://localhost:8080
x-airflow: &airflow
  build: .
  env_file: .env
  environment:
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    PYTHONPATH: /opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./ingestion:/opt/airflow/ingestion
    - ./config:/opt/airflow/config
    - ./dbt:/opt/airflow/dbt
    - ./data:/opt/airflow/data
    - ./credentials:/opt/airflow/credentials:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow:
    <<: *airflow
    command: standalone
    ports: ["8080:8080"]

volumes:
  pgdata:
