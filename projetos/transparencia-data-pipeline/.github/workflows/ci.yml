name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -v

  dbt:
    runs-on: ubuntu-latest
    needs: python
    # Roda só quando o segredo existir (forks e PRs externos pulam esta etapa).
    if: ${{ github.event_name == 'push' }}
    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install dbt-bigquery==1.8.*
      - name: Credencial
        run: echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json
        if: ${{ env.GCP_PROJECT != '' }}
      - name: dbt build (dataset de CI)
        if: ${{ env.GCP_PROJECT != '' }}
        working-directory: dbt
        run: dbt deps && dbt build --target ci --profiles-dir .
